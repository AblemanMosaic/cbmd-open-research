name: Verify public research tree

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -B tools/validate_repository.py
      - run: python -B discoveries/ech/genus-two-low-sector/explorer/source/build.py --check
      - run: node discoveries/ech/genus-two-low-sector/verification/test_pairing_explorer.cjs
