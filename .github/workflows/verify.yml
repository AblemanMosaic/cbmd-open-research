name: Verify public research tree

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run dependency-free repository gates
        run: python -B tools/qualify_repository.py --repository-only

  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Python qualification dependencies
        run: python -m pip install --requirement requirements-qualification.txt
      - name: Install GAP qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gap gap-smallgrp gap-character-tables
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: discoveries/dynamics/finite-capacity-chip-firing/verification/lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Run every declared discovery gate
        run: python -B tools/qualify_repository.py

  native-formal-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: proofs/native
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Recompile pinned native proof targets and audit logical dependencies
        run: python -B tools/replay_lean.py --prepare --fresh

  discovery-formal-replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: owner-fiber
            directory: discoveries/combinatorics/owner-fiber-structure/verification/lean
            replay: discoveries/combinatorics/owner-fiber-structure/verification/lean/replay.py
          - id: finite-capacity
            directory: discoveries/dynamics/finite-capacity-chip-firing/verification/lean
            replay: discoveries/dynamics/finite-capacity-chip-firing/verification/lean/replay.py
          - id: weighted-capacity
            directory: discoveries/dynamics/weighted-capacity-chip-firing/verification/lean
            replay: discoveries/dynamics/weighted-capacity-chip-firing/verification/lean/replay.py
          - id: capacity-preservation
            directory: discoveries/concurrency/capacity-preservation-boundary/verification/lean
            replay: discoveries/concurrency/capacity-preservation-boundary/verification/lean/replay.py
          - id: fixed-state
            directory: discoveries/dynamics/fixed-state-capacity-chip-firing/verification/lean
            replay: discoveries/dynamics/fixed-state-capacity-chip-firing/verification/lean/replay.py
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Formal replay (${{ matrix.id }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: ${{ matrix.directory }}
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Recompile source-bound discovery theorem
        run: python -B ${{ matrix.replay }} --build
